server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Default body size
    client_max_body_size 10m;

    # Static SPA files
    root /usr/share/nginx/html;
    index index.html;

    # Notification API routes (must come BEFORE /api/ catch-all)
    location ~ ^/api/(register-notif|refresh-notif-token|sync-deadlines|check-deadlines) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Moodle-Session $http_x_moodle_session;
        proxy_set_header X-Panoramix-Token $http_x_panoramix_token;
    }

    # Panoramix CORS proxy
    location /panoramix-api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Panoramix-Token $http_x_panoramix_token;
        proxy_set_header Authorization $http_authorization;
    }

    # Gandalf CORS proxy (catch-all for /api/)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Moodle-Session $http_x_moodle_session;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
